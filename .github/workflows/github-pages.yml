name: Publish GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The report is built here rather than committed: it derives in full from
      # the results/<tool>/*.toml files, the test sources and the templates,
      # all of which are in the repository. Rendering runs no analyzer -- it
      # needs only the runner's own dependencies.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install the runner's dependencies
        run: composer install --no-interaction --no-progress --working-dir=conformance

      - name: Render the report
        run: make render-report-html

      - name: Prepare site root
        run: |
          mkdir -p site/tests
          cp conformance/results/index.html site/index.html
          cp conformance/results/report.css site/report.css
          cp conformance/results/ogp.png site/ogp.png
          cp conformance/results/tests/*.html site/tests/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
