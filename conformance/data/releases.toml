# Latest upstream release of every artifact the report describes, as shown in
# the "Latest release" column of both reference tables.
#
# This is the injected half of the metadata: everything else about a tool --
# who founded it, what entity is behind it, what it parses with -- is a curated
# judgement hardcoded in src/Metadata/Analyzer/<Tool>.php or
# src/Metadata/LanguageServer/<Tool>.php, and only changes when the project
# itself does. These two fields go stale on their own, so they live here where
# a script can rewrite the file wholesale from upstream release feeds without
# touching any curation.
#
# Intelephense and Psalm have one entry apiece, read by both tables: each is
# the same artifact reached two ways, so a single release date is the honest
# answer. devsense-php-ls and phpy are the opposite case -- one engine, two
# separately versioned artifacts -- and so get an entry each.
#
# Not to be confused with results/<tool>/version.toml, which records the
# version this suite actually ran. This file records what upstream has shipped
# most recently, which may be newer.
#
# Keys are the runner's tool names. `version` is whatever upstream calls the
# release -- "unversioned" where a project ships without version numbers --
# and `date` is an ISO 8601 calendar date.

