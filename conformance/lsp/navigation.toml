# Can a language server enumerate a real project's dependency graph?
#
# Each symbol below names one declaration in the psysh checkout of the
# steins-survey corpus, one use site to jump FROM (go to definition must land
# on the declaration line), and the complete set of code references the
# server should enumerate when asked from the declaration (find references
# with includeDeclaration). The corpus is pinned to a commit, so positions
# are line numbers, verified against the checkout at load time; `at` names
# the token within that line and only supplies the column.
#
# The reference lists are complete over src/ and test/ by construction
# (assembled by exhaustive grep, code references only — mentions inside
# docblocks and string literals deliberately excluded). Recall is therefore
# measurable as found/expected, and anything else a server returns is
# counted as an extra. The corpus sets two deliberate precision traps:
# Psy\info() coexists with the unrelated FakePsrLogger::info(), and
# Context::getAll() with several other getAll() methods (History, etc.), so
# a server that matches references by name alone reports inflated extras.
#
# One kind the user asked for is absent by honest necessity: psysh defines
# NO namespace-level constant that any code references (its SOME_CONSTANT /
# NS_CONST test constants are only ever named inside string literals).
# Class constants are covered by Shell::VERSION below; measuring define()/
# const navigation needs a corpus from another era — ec-cube2 in the same
# survey is the natural candidate — and is left for a follow-up.

root = "~/repo/php/steins-survey/psysh"
commit = "0e8ec1af599068441378bacf60f44a5975fb3d4f"
project = "psy/psysh"

