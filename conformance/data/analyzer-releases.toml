# Latest upstream release of each analyzer, as shown in the "Latest release"
# column of the report's analyzer table.
#
# This is the injected half of the analyzer metadata: everything else about a
# tool -- who founded it, what entity is behind it, what it parses with -- is a
# curated judgement hardcoded in src/Metadata/Analyzer/<Tool>.php, and only
# changes when the project itself does. These two fields go stale on their own,
# so they live here where a script can rewrite the file wholesale from upstream
# release feeds without touching any curation.
#
# Not to be confused with results/<tool>/version.toml, which records the
# version this suite actually ran. This file records what upstream has shipped
# most recently, which may be newer.
#
# Keys are the runner's tool names. `version` is whatever upstream calls the
# release -- "unversioned" where a project ships without version numbers --
# and `date` is an ISO 8601 calendar date.

[phan]
version = "6.0.7"
date = "2026-06-22"

[psalm]
version = "6.16.1"
date = "2026-03-19"

[phpstan]
version = "2.2.5"
date = "2026-07-05"

[intelephense]
version = "1.18.5"
date = "2026-06-21"

[noverify]
version = "0.5.5"
date = "2025-04-22"

[mago]
version = "1.44.0"
date = "2026-07-18"

[phpy]
version = "1.0.18519"
date = "2026-02-19"

[mir]
version = "0.60.0"
date = "2026-07-18"

[pzoom]
